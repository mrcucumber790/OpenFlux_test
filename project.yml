name: OpenFluxiOS

options:
  deploymentTarget:
    iOS: "15.0"

targets:
  OpenFluxiOS:
    type: application
    platform: iOS

    sources:
      - path: OpenFluxiOS

    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.openflux.client
      INFOPLIST_FILE: OpenFluxiOS/Info.plist
      SWIFT_VERSION: "5.0"
      SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/OpenFluxiOS/OpenFluxBridge.h"

      HEADER_SEARCH_PATHS:
        - "$(SRCROOT)/output/ios"

      LIBRARY_SEARCH_PATHS:
        - "$(SRCROOT)/output/ios"

      OTHER_LDFLAGS:
        - "-loflux"
        - "-framework"
        - "Foundation"
        - "-framework"
        - "Network"

      CODE_SIGNING_ALLOWED: "NO"
      CODE_SIGNING_REQUIRED: "NO"
